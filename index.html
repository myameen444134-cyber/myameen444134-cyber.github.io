<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0612">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Soul Clash — Realm Duel</title>

<!-- Live Google AdSense loader -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9095796747717714"
     crossorigin="anonymous"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;900&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-void: #0a0612;
    --panel-border: rgba(240, 234, 255, 0.14);
    --text-light: #f0eaff;

    --human-bg: #16213e;
    --human-glow: #4ea8ff;
    --human-gold: #ffd166;

    --demon-bg: #2b0a12;
    --demon-glow: #ff4747;

    --gold: #ffdd57;
    --warn: #ff6b6b;
    --trap-purple: #6a0dad;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    height: 100%;
    overscroll-behavior: none;
  }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    font-family: 'Cinzel', Georgia, serif;
    color: var(--text-light);
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    background: var(--bg-void);
  }

  .game-wrapper {
    position: relative;
    flex: 1;
    width: 100%;
    display: flex;
    flex-direction: column;
  }

  /* ---------- Player zones: each half is an orb-catching arena ---------- */
  .player-zone {
    position: relative;
    flex: 1;
    width: 100%;
    border: none;
    cursor: pointer;
    touch-action: none;  /* we handle taps/swipes ourselves -- no browser scroll/zoom */
    overflow: hidden;
    font-family: inherit;
    color: var(--text-light);
    transition: filter 0.08s ease, transform 0.08s ease;
  }

  /* Human Realm is flipped 180deg so it reads right-side up to
     someone sitting opposite the person holding the phone normally.
     Both zones stay dark/void at heart, with a soft realm-colored
     glow washing in from the boundary -- "dark and moody" first,
     magical color second. */
  .player-one {
    background:
      radial-gradient(circle at 50% 15%, rgba(78, 168, 255, 0.22), transparent 55%),
      linear-gradient(160deg, var(--human-bg), var(--bg-void) 75%);
    transform: rotate(180deg);
  }
  .player-two {
    background:
      radial-gradient(circle at 50% 85%, rgba(255, 71, 71, 0.22), transparent 55%),
      linear-gradient(160deg, var(--demon-bg), var(--bg-void) 75%);
  }

  .player-zone:active { filter: brightness(1.15); }

  /* Each :active rule restates its own base transform -- otherwise
     Human Realm would visibly "un-flip" for an instant on tap. */
  .player-one:active { transform: rotate(180deg) scale(0.985); }
  .player-two:active { transform: scale(0.985); }

  .player-zone:focus-visible {
    outline: 3px solid var(--gold);
    outline-offset: -6px;
  }

  .player-zone:disabled {
    cursor: not-allowed;
    filter: brightness(0.45) saturate(0.6);
  }

  /* ---------- Layers stacked inside each zone ---------- */
  .orb-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 1;
  }

  .float-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 2;
  }

  /* Brief warning wash across the whole zone when a trap is hit */
  .zone-flash {
    position: absolute;
    inset: 0;
    background: rgba(255, 60, 60, 0.4);
    opacity: 0;
    pointer-events: none;
    z-index: 4;
  }
  .zone-flash.active {
    animation: flashFade 0.4s ease-out;
  }
  @keyframes flashFade {
    0%   { opacity: 1; }
    100% { opacity: 0; }
  }

  /* HUD uses "bottom" for BOTH zones on purpose: for the rotated
     Human Realm zone this lands near the physical top of the screen
     (close to that player); for Demon Realm it lands near the
     physical bottom. Same rule, correct result on both sides. */
  .player-hud {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 8px 22px;
    background: rgba(10, 6, 18, 0.5);
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .player-one .player-hud { bottom: calc(10px + env(safe-area-inset-top)); }
  .player-two .player-hud { bottom: calc(10px + env(safe-area-inset-bottom)); }

  .player-label {
    font-size: clamp(0.7rem, 2.2vw, 0.9rem);
    letter-spacing: 0.18em;
    font-weight: 600;
    opacity: 0.9;
  }
  .player-one .player-label {
    color: var(--human-gold);
    text-shadow: 0 0 10px rgba(255, 209, 102, 0.6);
  }
  .player-two .player-label {
    color: var(--demon-glow);
    text-shadow: 0 0 10px rgba(255, 71, 71, 0.55);
  }

  .player-score {
    font-size: clamp(1.8rem, 8vw, 2.6rem);
    font-weight: 700;
    line-height: 1;
  }
  .player-one .player-score { color: var(--human-glow); text-shadow: 0 0 14px rgba(78, 168, 255, 0.75); }
  .player-two .player-score { color: var(--demon-glow); text-shadow: 0 0 14px rgba(255, 71, 71, 0.75); }
  .player-score.pop { animation: scorePop 0.28s ease; }
  @keyframes scorePop {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.25); }
    100% { transform: scale(1); }
  }

  /* ---------- Orbs: glowing souls, not plain circles ----------
     Three stacked box-shadow rings (bright core / mid glow / soft
     outer halo) do the heavy lifting -- the fill is just a small
     gradient disc underneath the glow. */
  .orb-wrapper {
    position: absolute;
    left: 0;
    top: 0;
    width: 52px;
    height: 52px;
    will-change: transform;
  }
  .orb {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    animation: orbPulse 1.3s ease-in-out infinite;
  }
  .orb-p1 {
    background: radial-gradient(circle at 35% 30%, #ffffff, var(--human-glow) 55%, transparent 80%);
    box-shadow:
      0 0 10px 2px #ffffff,
      0 0 22px 8px var(--human-glow),
      0 0 38px 14px rgba(255, 209, 102, 0.55);
  }
  .orb-p2 {
    background: radial-gradient(circle at 35% 30%, #ffcdb0, var(--demon-glow) 55%, #1a0305 82%);
    box-shadow:
      0 0 10px 2px #ff9d6e,
      0 0 22px 8px var(--demon-glow),
      0 0 38px 14px rgba(10, 2, 4, 0.85);
  }
  @keyframes orbPulse {
    0%, 100% { transform: scale(1);    opacity: 0.9; }
    50%      { transform: scale(1.14); opacity: 1; }
  }

  /* ---------- Power-up: Golden Relic (rare, +10) ----------
     Brighter and more saturated than either realm's own orbs, plus
     its own faster/rockier pulse, so it reads as "special" no
     matter which half it spawns in. */
  .orb-relic {
    background: radial-gradient(circle at 35% 30%, #fffbe6, var(--gold) 55%, #a6790a 85%);
    box-shadow:
      0 0 10px 3px #fffbe6,
      0 0 26px 10px var(--gold),
      0 0 44px 16px rgba(255, 221, 87, 0.6);
    animation: relicPulse 0.85s ease-in-out infinite;
  }
  @keyframes relicPulse {
    0%, 100% { transform: scale(1) rotate(0deg); }
    50%      { transform: scale(1.2) rotate(8deg); }
  }

  /* ---------- Trap: Cursed Skull (occasional, -5) ----------
     Dark purple fading to near-black -- deliberately the coldest,
     dimmest orb on screen so it visually warns "avoid me". */
  .orb-trap {
    background: radial-gradient(circle at 35% 30%, #8a4fc2, #3d0a5c 55%, #05010a 88%);
    box-shadow:
      0 0 10px 3px rgba(138, 79, 194, 0.6),
      0 0 24px 8px rgba(90, 20, 130, 0.7),
      0 0 40px 14px rgba(0, 0, 0, 0.75);
    animation: trapPulse 0.75s ease-in-out infinite;
  }
  @keyframes trapPulse {
    0%, 100% { transform: scale(1) rotate(0deg); }
    50%      { transform: scale(1.08) rotate(-8deg); }
  }

  /* Higher specificity than .orb-p1/.orb-p2, so this overrides just
     the animation on expiry while the glow keeps showing as it fades. */
  .orb.orb-expire {
    animation: orbExpireAnim 0.22s ease-in forwards;
  }
  @keyframes orbExpireAnim {
    from { transform: scale(1);   opacity: 1; }
    to   { transform: scale(0.4); opacity: 0; }
  }

  /* ---------- Floating "+1" + impact ring on collect ---------- */
  .float-text {
    position: absolute;
    transform: translate(-50%, -50%);
    font-weight: 700;
    font-size: clamp(1rem, 4vw, 1.4rem);
    color: #ffffff;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
    animation: floatUp 0.8s ease-out forwards;
  }
  .player-one .float-text { color: var(--human-gold); }
  .player-two .float-text { color: #ffb199; }
  .float-text.float-relic { color: var(--gold); font-size: clamp(1.2rem, 5vw, 1.7rem); }
  .float-text.float-trap  { color: var(--warn); }
  @keyframes floatUp {
    0%   { transform: translate(-50%, -50%) scale(1);    opacity: 1; }
    100% { transform: translate(-50%, -220%) scale(1.4); opacity: 0; }
  }

  .orb-burst {
    position: absolute;
    width: 14px;
    height: 14px;
    margin-left: -7px;
    margin-top: -7px;
    border-radius: 50%;
    border: 3px solid #ffffff;
    animation: burstRing 0.45s ease-out forwards;
  }
  .player-one .orb-burst { border-color: var(--human-glow); }
  .player-two .orb-burst { border-color: var(--demon-glow); }
  .orb-burst.burst-relic { border-color: var(--gold); }
  .orb-burst.burst-trap  { border-color: var(--trap-purple); }
  @keyframes burstRing {
    0%   { transform: scale(1); opacity: 1; }
    100% { transform: scale(6); opacity: 0; }
  }

  /* ---------- Center timer: floats where the two realms meet ---------- */
  .center-timer {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 5;
    pointer-events: none;
    width: clamp(64px, 20vw, 88px);
    height: clamp(64px, 20vw, 88px);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle, #140a24, var(--bg-void) 80%);
    border: 3px solid transparent;
    border-image: linear-gradient(135deg, var(--human-glow), var(--demon-glow)) 1;
    box-shadow: 0 0 24px rgba(0, 0, 0, 0.6);
    font-size: clamp(1.4rem, 7vw, 2rem);
    font-weight: 700;
    color: var(--text-light);
  }
  .center-timer.time-warning {
    color: var(--warn);
    animation: timerPulse 1s ease-in-out infinite;
  }
  @keyframes timerPulse {
    0%, 100% { transform: translate(-50%, -50%) scale(1); }
    50%      { transform: translate(-50%, -50%) scale(1.12); }
  }

  /* ---------- Start Screen + Instructions + Game Over share the same popup chrome ---------- */
  .start-screen,
  .instructions-screen,
  .game-over-overlay {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(5, 2, 10, 0.8);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    padding: 20px;
  }
  .start-screen.is-visible,
  .instructions-screen.is-visible,
  .game-over-overlay.is-visible {
    opacity: 1;
    pointer-events: auto;
  }

  .start-card,
  .instructions-card,
  .game-over-card {
    width: 100%;
    max-width: 340px;
    max-height: 92vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 40px 32px;
    background: linear-gradient(165deg, #170c28, var(--bg-void));
    border: 1px solid var(--panel-border);
    border-radius: 28px;
    text-align: center;
    transform: scale(0.9);
    transition: transform 0.3s ease;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
  }
  .start-screen.is-visible .start-card,
  .instructions-screen.is-visible .instructions-card,
  .game-over-overlay.is-visible .game-over-card { transform: scale(1); }

  /* ---------- Start Screen content ---------- */
  .start-eyebrow {
    font-size: clamp(0.7rem, 2.5vw, 0.85rem);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--gold);
    opacity: 0.85;
  }

  .start-title {
    font-size: clamp(2.2rem, 10vw, 3.2rem);
    font-weight: 900;
    line-height: 1.1;
    color: var(--gold); /* fallback if background-clip:text isn't supported */
  }
  @supports ((-webkit-background-clip: text) or (background-clip: text)) {
    .start-title {
      background: linear-gradient(135deg, var(--human-glow), var(--gold) 50%, var(--demon-glow));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }
  }

  .duration-select {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    width: 100%;
    margin-top: 6px;
  }
  .duration-label {
    font-size: clamp(0.7rem, 2.2vw, 0.85rem);
    letter-spacing: 0.2em;
    opacity: 0.7;
    font-weight: 600;
  }
  .duration-options {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
  }
  .duration-option {
    min-width: 54px;
    padding: 10px 14px;
    border: 1px solid var(--panel-border);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.04);
    color: var(--text-light);
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    touch-action: manipulation;
    transition: transform 0.08s ease, border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
  }
  .duration-option:active { transform: scale(0.94); }
  .duration-option.is-selected {
    border-color: var(--gold);
    background: rgba(255, 221, 87, 0.15);
    color: var(--gold);
    box-shadow: 0 0 14px rgba(255, 221, 87, 0.35);
  }
  .duration-option:focus-visible {
    outline: 3px solid var(--gold);
    outline-offset: 2px;
  }

  .audio-toggles {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .toggle-btn {
    padding: 8px 16px;
    border: 1.5px solid var(--panel-border);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.03);
    color: var(--text-light);
    font-family: inherit;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    touch-action: manipulation;
    opacity: 0.65;
    transition: transform 0.08s ease, opacity 0.15s ease, border-color 0.15s ease, background 0.15s ease;
  }
  .toggle-btn.is-on {
    border-color: var(--gold);
    background: rgba(255, 221, 87, 0.1);
    color: var(--gold);
    opacity: 1;
  }
  .toggle-btn:active { transform: scale(0.96); }
  .toggle-btn:focus-visible {
    outline: 3px solid var(--gold);
    outline-offset: 3px;
  }

  /* ---------- Instructions screen content ---------- */
  .rules-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    margin: 4px 0;
  }
  .rules-list li {
    display: flex;
    align-items: center;
    gap: 12px;
    text-align: left;
    font-size: 0.95rem;
    font-weight: 500;
    color: var(--text-light);
  }
  .rule-icon {
    flex-shrink: 0;
    width: 1.5em;
    font-size: 1.25rem;
    text-align: center;
  }
  .rule-dot {
    flex-shrink: 0;
    width: 16px;
    height: 16px;
    margin: 0 0.25em;
    border-radius: 50%;
    box-shadow: 0 0 8px 2px currentColor;
  }
  .rule-dot-human { background: var(--human-glow); color: var(--human-glow); }
  .rule-dot-demon { background: var(--demon-glow); color: var(--demon-glow); }
  .rule-value-relic { color: var(--gold); font-weight: 700; }
  .rule-value-trap { color: var(--warn); font-weight: 700; }

  .start-btn {
    margin-top: 8px;
    padding: 16px 48px;
    border: 2px solid var(--gold);
    border-radius: 999px;
    background: linear-gradient(145deg, #241536, #150a20);
    color: var(--gold);
    font-family: inherit;
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    cursor: pointer;
    touch-action: manipulation;
    box-shadow: 0 0 20px rgba(255, 221, 87, 0.4), 0 8px 0 rgba(0, 0, 0, 0.4);
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }
  .start-btn:active {
    transform: translateY(6px) scale(0.96);
    box-shadow: 0 0 12px rgba(255, 221, 87, 0.3), 0 2px 0 rgba(0, 0, 0, 0.4);
  }
  .start-btn:focus-visible {
    outline: 3px solid var(--gold);
    outline-offset: 4px;
  }

  .result-title {
    font-size: clamp(1.8rem, 8vw, 2.6rem);
    font-weight: 700;
  }
  .result-title.winner-p1  { color: var(--human-glow); }
  .result-title.winner-p2  { color: var(--demon-glow); }
  .result-title.winner-tie { color: var(--gold); }

  .result-scores {
    font-size: clamp(1.1rem, 4.5vw, 1.4rem);
    opacity: 0.85;
    font-weight: 600;
  }

  .play-again-btn {
    margin-top: 4px;
    padding: 14px 40px;
    border: 2px solid var(--gold);
    border-radius: 999px;
    background: linear-gradient(145deg, #241536, #150a20);
    color: var(--gold);
    font-family: inherit;
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    cursor: pointer;
    touch-action: manipulation;
    box-shadow: 0 0 18px rgba(255, 221, 87, 0.35), 0 8px 0 rgba(0, 0, 0, 0.4);
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }
  .play-again-btn:active {
    transform: translateY(6px) scale(0.96);
    box-shadow: 0 0 10px rgba(255, 221, 87, 0.25), 0 2px 0 rgba(0, 0, 0, 0.4);
  }
  .play-again-btn:focus-visible {
    outline: 3px solid var(--gold);
    outline-offset: 4px;
  }

  /* Secondary action -- clearly tappable but deliberately quieter
     than Play Again so it doesn't compete for attention. */
  .menu-btn {
    margin-top: 2px;
    padding: 10px 32px;
    border: 1px solid var(--panel-border);
    border-radius: 999px;
    background: transparent;
    color: var(--text-light);
    font-family: inherit;
    font-size: 0.9rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    cursor: pointer;
    touch-action: manipulation;
    opacity: 0.75;
    transition: transform 0.08s ease, opacity 0.15s ease, border-color 0.15s ease;
  }
  .menu-btn:active {
    transform: scale(0.96);
    opacity: 1;
  }
  .menu-btn:focus-visible {
    outline: 3px solid var(--gold);
    outline-offset: 4px;
  }

  /* ---------- Small-screen tweaks ---------- */
  @media (max-height: 480px) {
    .center-timer {
      width: clamp(50px, 16vw, 66px);
      height: clamp(50px, 16vw, 66px);
      font-size: clamp(1.1rem, 6vw, 1.5rem);
    }
    .player-hud { padding: 6px 16px; }
    .player-score { font-size: clamp(1.4rem, 7vw, 2rem); }
    .game-over-card { padding: 24px 22px; }
    .start-card { padding: 26px 22px; }
    .start-title { font-size: clamp(1.8rem, 9vw, 2.4rem); }
  }

  /* ---------- Respect reduced-motion preference ----------
     Orb MOVEMENT is JS-driven (requestAnimationFrame), not CSS, so
     the core gameplay is unaffected -- only decorative pulses/pops
     are minimized. */
  @media (prefers-reduced-motion: reduce) {
    * {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
  }
</style>
</head>
<body>

  <div class="game-wrapper" id="gameWrapper">

    <button type="button" class="player-zone player-one" id="p1Zone" aria-label="Human Realm play area" disabled>
      <div class="zone-flash" id="p1Flash" aria-hidden="true"></div>
      <div class="orb-layer" id="p1OrbLayer" aria-hidden="true"></div>
      <div class="float-layer" id="p1FloatLayer" aria-hidden="true"></div>
      <div class="player-hud">
        <span class="player-label">HUMAN REALM</span>
        <span class="player-score" id="p1Score">0</span>
      </div>
    </button>

    <div class="center-timer" id="centerTimer">
      <span id="timerValue">30</span>
    </div>

    <button type="button" class="player-zone player-two" id="p2Zone" aria-label="Demon Realm play area" disabled>
      <div class="zone-flash" id="p2Flash" aria-hidden="true"></div>
      <div class="orb-layer" id="p2OrbLayer" aria-hidden="true"></div>
      <div class="float-layer" id="p2FloatLayer" aria-hidden="true"></div>
      <div class="player-hud">
        <span class="player-label">DEMON REALM</span>
        <span class="player-score" id="p2Score">0</span>
      </div>
    </button>

    <!-- Game Over: a single popup, centered over both realms -->
    <div class="game-over-overlay" id="gameOverOverlay" aria-hidden="true">
      <div class="game-over-card">
        <h2 class="result-title" id="resultTitle"></h2>
        <p class="result-scores" id="resultScores"></p>

        <!-- Live AdSense banner (300x250) for the Game Over screen -->
        <ins class="adsbygoogle"
             style="display:inline-block;width:300px;height:250px"
             data-ad-client="ca-pub-9095796747717714"
             data-ad-slot="5598048829"></ins>
        <script>
             (adsbygoogle = window.adsbygoogle || []).push({});
        </script>

        <button type="button" class="play-again-btn" id="playAgainBtn">Play Again</button>
        <button type="button" class="menu-btn" id="mainMenuBtn">Main Menu</button>
      </div>
    </div>

    <!-- Start Screen: shown only on first load. Play Again later
         skips straight back into a new round -- see resetGame(). -->
    <div class="start-screen is-visible" id="startScreen" aria-hidden="false">
      <div class="start-card">
        <p class="start-eyebrow">A Dark Fantasy Duel</p>
        <h1 class="start-title">Soul Clash</h1>

        <div class="duration-select" role="group" aria-label="Round length">
          <span class="duration-label">ROUND LENGTH</span>
          <div class="duration-options" id="durationOptions">
            <button type="button" class="duration-option" data-duration="10">10s</button>
            <button type="button" class="duration-option" data-duration="15">15s</button>
            <button type="button" class="duration-option" data-duration="20">20s</button>
            <button type="button" class="duration-option" data-duration="25">25s</button>
            <button type="button" class="duration-option is-selected" data-duration="30">30s</button>
            <button type="button" class="duration-option" data-duration="45">45s</button>
            <button type="button" class="duration-option" data-duration="60">60s</button>
          </div>
        </div>

        <div class="audio-toggles" role="group" aria-label="Audio settings">
          <button type="button" class="toggle-btn is-on" id="musicToggle" aria-pressed="true">🎵 Music: ON</button>
          <button type="button" class="toggle-btn is-on" id="sfxToggle" aria-pressed="true">🔊 SFX: ON</button>
        </div>

        <button type="button" class="start-btn" id="startBtn">Start Game</button>
      </div>
    </div>

    <!-- Instructions: shown after Start Game, before the round actually begins -->
    <div class="instructions-screen" id="instructionsScreen" aria-hidden="true">
      <div class="instructions-card">
        <p class="start-eyebrow">How to Play</p>
        <h2 class="start-title">Know Your Realm</h2>

        <ul class="rules-list">
          <li><span class="rule-dot rule-dot-human"></span> Human Realm: Blue Souls</li>
          <li><span class="rule-dot rule-dot-demon"></span> Demon Realm: Red Souls</li>
          <li><span class="rule-icon">👆</span> Tap or swipe an orb to collect it</li>
          <li><span class="rule-icon">💎</span> Golden Relic = <span class="rule-value-relic">+10 pts</span></li>
          <li><span class="rule-icon">💀</span> Cursed Skull = <span class="rule-value-trap">-5 pts</span></li>
        </ul>

        <button type="button" class="start-btn" id="playNowBtn">Play Now!</button>
      </div>
    </div>

  </div>

  <script>
  (function () {
    'use strict';

    // ---------------------------------------------------------------
    // CONFIG -- tune feel here (unchanged from the working version;
    // this update only touches visuals)
    // ---------------------------------------------------------------
    let GAME_DURATION = 30;          // seconds -- overwritten by the Start Screen's round-length choice
    const MAX_ORBS_PER_ZONE = 4;
    const TAP_TOLERANCE = 14;        // extra px of forgiveness around each orb
    const SPAWN_INTERVAL_START = 800; // ms between spawns at round start (roughly; jittered)
    const SPAWN_INTERVAL_END = 450;   // ms between spawns right at round end -- spawning ramps up to this
    const ORB_LIFETIME = 2200;       // ms an orb stays before fading if untapped -- same for every type
    const TYPE_ROLLS = { relic: 0.08, trap: 0.18 }; // remainder spawns as 'normal'
    const SCORE_VALUES = { normal: 1, relic: 10, trap: -5 };
    const SPEED_MIN = 70;            // px/second at round start (bumped further, was 58)
    const SPEED_MAX = 148;           // px/second at round start (bumped further, was 123)
    const SPEED_MULT_END = 1.6;      // extra multiplier reached right as the timer hits 0 -- ramps up smoothly over the round
    const SPEED_RAMP_MAX = 1.7;      // by round end, newly spawned orbs move up to 1.7x base speed
    const ZONE_MARGIN = { top: 0.10, bottom: 0.30, left: 0.08, right: 0.08 }; // fraction of zone reserved from spawns (bottom keeps clear of the HUD)
    const ORB_SIZE = Math.max(44, Math.min(64, Math.round(window.innerWidth * 0.14)));

    // ---------------------------------------------------------------
    // STATE
    // ---------------------------------------------------------------
    let timeLeft = GAME_DURATION;
    let gameActive = false; // becomes true once Start Game is pressed
    let timerId = null;
    let rafId = null;
    let lastFrameTime = null;

    const zones = {
      p1: {
        key: 'p1',
        rotated: true,
        el: document.getElementById('p1Zone'),
        orbLayer: document.getElementById('p1OrbLayer'),
        floatLayer: document.getElementById('p1FloatLayer'),
        flashEl: document.getElementById('p1Flash'),
        scoreEl: document.getElementById('p1Score'),
        score: 0,
        orbs: [],
        bounds: null,
        width: 0,
        height: 0,
        spawnTimeoutId: null,
      },
      p2: {
        key: 'p2',
        rotated: false,
        el: document.getElementById('p2Zone'),
        orbLayer: document.getElementById('p2OrbLayer'),
        floatLayer: document.getElementById('p2FloatLayer'),
        flashEl: document.getElementById('p2Flash'),
        scoreEl: document.getElementById('p2Score'),
        score: 0,
        orbs: [],
        bounds: null,
        width: 0,
        height: 0,
        spawnTimeoutId: null,
      },
    };

    const centerTimerEl   = document.getElementById('centerTimer');
    const timerValueEl    = document.getElementById('timerValue');
    const gameOverOverlay = document.getElementById('gameOverOverlay');
    const resultTitleEl   = document.getElementById('resultTitle');
    const resultScoresEl  = document.getElementById('resultScores');
    const playAgainBtn    = document.getElementById('playAgainBtn');
    const mainMenuBtn     = document.getElementById('mainMenuBtn');
    const startScreen     = document.getElementById('startScreen');
    const startBtn        = document.getElementById('startBtn');
    const instructionsScreen = document.getElementById('instructionsScreen');
    const playNowBtn         = document.getElementById('playNowBtn');
    const musicToggleBtn  = document.getElementById('musicToggle');
    const sfxToggleBtn    = document.getElementById('sfxToggle');

    // ---------------------------------------------------------------
    // AD CONFIGURATION
    //  - Banner: live now -- the AdSense <ins class="adsbygoogle"> unit
    //    sits directly in the Game Over card's HTML (below), and is
    //    initialized once by its own inline script block at parse time.
    //    Nothing here needs to call it again.
    //  - Interstitial: the natural trigger point is right as the
    //    round ends -- see the AD TRIGGER POINT comment inside
    //    endGame() below.
    // ---------------------------------------------------------------
    // function showInterstitialAd() {
    //   // e.g. AdMob.showInterstitial() / adsbygoogle push, etc.
    // }

    // ---------------------------------------------------------------
    // AUDIO
    // Everything here is synthesized with the Web Audio API -- no
    // mp3/wav files. Toggled from the Start Screen only; the chosen
    // on/off state is simply read whenever a sound would play.
    // ---------------------------------------------------------------
    let audioCtx = null;
    let musicEnabled = true;
    let sfxEnabled = true;
    let musicNodes = null; // { gain, nodes[] } while the ambient pad is playing, else null

    // Created lazily on the first tap (browsers block audio until a
    // real user gesture), and resumed if the browser auto-suspended it.
    function ensureAudioContext() {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AC();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    // Soft rising blip for a regular Soul Orb.
    function playNormalSound() {
      if (!sfxEnabled) return;
      const ctx = ensureAudioContext();
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(700, now);
      osc.frequency.exponentialRampToValueAtTime(950, now + 0.08);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.25, now + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.15);
      osc.connect(gain).connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.16);
    }

    // Bright ascending three-note chime for the Golden Relic (+10).
    function playRelicSound() {
      if (!sfxEnabled) return;
      const ctx = ensureAudioContext();
      const now = ctx.currentTime;
      const notes = [880, 1108.73, 1318.51]; // A5, C#6, E6 -- major triad
      notes.forEach(function (freq, i) {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.value = freq;
        const t = now + i * 0.07;
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.22, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
        osc.connect(gain).connect(ctx.destination);
        osc.start(t);
        osc.stop(t + 0.36);
      });
    }

    // Low filtered buzz/thud with a falling pitch for the Cursed Skull (-5).
    function playTrapSound() {
      if (!sfxEnabled) return;
      const ctx = ensureAudioContext();
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const filter = ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 400;
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(180, now);
      osc.frequency.exponentialRampToValueAtTime(60, now + 0.3);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.3, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.35);
      osc.connect(filter).connect(gain).connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.36);
    }

    // Soft ambient pad: a sustained open fifth + octave (C2-G2-C3)
    // with slow independent LFOs breathing on each voice's volume.
    // Continuous synthesis rather than a discrete audio loop, but
    // reads the same way -- an unbroken, gently cycling dark drone.
    function startMusic() {
      if (!musicEnabled || musicNodes) return;
      const ctx = ensureAudioContext();
      const now = ctx.currentTime;

      const musicGain = ctx.createGain();
      musicGain.gain.setValueAtTime(0.0001, now);
      musicGain.gain.exponentialRampToValueAtTime(0.16, now + 2);
      musicGain.connect(ctx.destination);

      const freqs = [65.41, 98.0, 130.81]; // C2, G2, C3
      const nodes = [];
      freqs.forEach(function (freq, i) {
        const osc = ctx.createOscillator();
        osc.type = i === 1 ? 'triangle' : 'sine';
        osc.frequency.value = freq;
        osc.detune.value = (i - 1) * 6;

        const voiceGain = ctx.createGain();
        voiceGain.gain.value = 0.5;

        const lfo = ctx.createOscillator();
        lfo.frequency.value = 0.07 + i * 0.02;
        const lfoGain = ctx.createGain();
        lfoGain.gain.value = 0.25;
        lfo.connect(lfoGain).connect(voiceGain.gain);

        osc.connect(voiceGain).connect(musicGain);
        osc.start(now);
        lfo.start(now);
        nodes.push(osc, lfo);
      });

      musicNodes = { gain: musicGain, nodes: nodes };
    }

    function stopMusic() {
      if (!musicNodes) return;
      const ctx = ensureAudioContext();
      const now = ctx.currentTime;
      const toStop = musicNodes.nodes;
      musicNodes.gain.gain.cancelScheduledValues(now);
      musicNodes.gain.gain.setValueAtTime(Math.max(musicNodes.gain.gain.value, 0.0001), now);
      musicNodes.gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.5);
      window.setTimeout(function () {
        toStop.forEach(function (n) { try { n.stop(); } catch (e) {} });
      }, 600);
      musicNodes = null;
    }

    function setToggleState(btn, icon, label, enabled) {
      btn.classList.toggle('is-on', enabled);
      btn.setAttribute('aria-pressed', String(enabled));
      btn.textContent = icon + ' ' + label + ': ' + (enabled ? 'ON' : 'OFF');
    }

    function bindAudioToggles() {
      bindTap(musicToggleBtn, function () {
        musicEnabled = !musicEnabled;
        setToggleState(musicToggleBtn, '🎵', 'Music', musicEnabled);
      });
      bindTap(sfxToggleBtn, function () {
        sfxEnabled = !sfxEnabled;
        setToggleState(sfxToggleBtn, '🔊', 'SFX', sfxEnabled);
      });
    }

    // ---------------------------------------------------------------
    // UTILITIES
    // ---------------------------------------------------------------
    function rand(min, max) { return min + Math.random() * (max - min); }

    // How much faster newly-spawned orbs move as the round goes on.
    // 1 at the very start of the round, ramping up to SPEED_MULT_END
    // right as the timer hits 0. Uses the timeLeft/GAME_DURATION
    // ratio (not a fixed number of seconds) so the ramp scales
    // correctly whichever round length was picked on the Start Screen.
    function currentSpeedMultiplier() {
      const progress = 1 - (timeLeft / GAME_DURATION); // 0 at round start, 1 at round end
      return 1 + progress * (SPEED_MULT_END - 1);
    }

    // Mirrors currentSpeedMultiplier() above: spawns start at
    // SPAWN_INTERVAL_START ms apart and tighten to SPAWN_INTERVAL_END
    // ms apart by the time the timer hits 0, plus a little jitter so
    // spawns don't feel metronomic.
    function currentSpawnInterval() {
      const progress = 1 - (timeLeft / GAME_DURATION);
      const base = SPAWN_INTERVAL_START - (SPAWN_INTERVAL_START - SPAWN_INTERVAL_END) * progress;
      return base * rand(0.8, 1.2);
    }

    // Converts a viewport (client) point into the zone's own local
    // coordinate space. Human Realm is visually rotated 180deg, so
    // its local space is flipped on both axes relative to the screen.
    function clientToLocal(zone, clientX, clientY) {
      const rect = zone.el.getBoundingClientRect();
      let x = clientX - rect.left;
      let y = clientY - rect.top;
      if (zone.rotated) {
        x = rect.width - x;
        y = rect.height - y;
      }
      return { x: x, y: y };
    }

    // Shortest distance from point (px,py) to segment (x1,y1)-(x2,y2).
    // Lets a fast swipe that passes near an orb register the hit, not
    // just a swipe that lands exactly on a sampled point.
    function distanceToSegment(px, py, x1, y1, x2, y2) {
      const dx = x2 - x1;
      const dy = y2 - y1;
      const lengthSq = dx * dx + dy * dy;
      if (lengthSq === 0) return Math.hypot(px - x1, py - y1);
      let t = ((px - x1) * dx + (py - y1) * dy) / lengthSq;
      t = Math.max(0, Math.min(1, t));
      const projX = x1 + t * dx;
      const projY = y1 + t * dy;
      return Math.hypot(px - projX, py - projY);
    }

    // ---------------------------------------------------------------
    // ZONE BOUNDS (recomputed on load + resize)
    // ---------------------------------------------------------------
    function recomputeZoneBounds(zone) {
      const rect = zone.el.getBoundingClientRect();
      zone.width = rect.width;
      zone.height = rect.height;
      const marginLeft = zone.width * ZONE_MARGIN.left;
      const marginRight = zone.width * ZONE_MARGIN.right;
      const marginTop = zone.height * ZONE_MARGIN.top;
      const marginBottom = zone.height * ZONE_MARGIN.bottom;
      const r = ORB_SIZE / 2;
      zone.bounds = {
        left: marginLeft + r,
        right: Math.max(marginLeft + r, zone.width - marginRight - r),
        top: marginTop + r,
        bottom: Math.max(marginTop + r, zone.height - marginBottom - r),
      };
    }

    // ---------------------------------------------------------------
    // ORB LIFECYCLE
    // ---------------------------------------------------------------
    function pickOrbType() {
      const r = Math.random();
      if (r < TYPE_ROLLS.relic) return 'relic';
      if (r < TYPE_ROLLS.relic + TYPE_ROLLS.trap) return 'trap';
      return 'normal';
    }

    function orbVisualClass(type, zoneKey) {
      if (type === 'relic') return 'orb orb-relic';
      if (type === 'trap') return 'orb orb-trap';
      return 'orb orb-' + zoneKey; // normal souls keep the existing realm-tinted look
    }

    function orbIcon(type) {
      if (type === 'relic') return '💎';
      if (type === 'trap') return '💀';
      return '';
    }

    function spawnOrb(zone) {
      if (!gameActive) return;
      if (!zone.bounds) return;
      if (zone.orbs.length >= MAX_ORBS_PER_ZONE) return;

      const type = pickOrbType();
      const radius = ORB_SIZE / 2;
      const x = rand(zone.bounds.left, zone.bounds.right);
      const y = rand(zone.bounds.top, zone.bounds.bottom);
      const angle = rand(0, Math.PI * 2);
      const speed = rand(SPEED_MIN, SPEED_MAX) * currentSpeedMultiplier();

      const wrapperEl = document.createElement('div');
      wrapperEl.className = 'orb-wrapper';
      wrapperEl.style.width = ORB_SIZE + 'px';
      wrapperEl.style.height = ORB_SIZE + 'px';

      const innerEl = document.createElement('div');
      innerEl.className = orbVisualClass(type, zone.key);
      innerEl.textContent = orbIcon(type);
      innerEl.style.fontSize = Math.round(ORB_SIZE * 0.55) + 'px';

      wrapperEl.appendChild(innerEl);
      zone.orbLayer.appendChild(wrapperEl);

      const orb = {
        type: type,
        x: x,
        y: y,
        radius: radius,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        spawnTime: performance.now(),
        wrapperEl: wrapperEl,
        innerEl: innerEl,
      };

      wrapperEl.style.transform = 'translate(' + (x - radius) + 'px, ' + (y - radius) + 'px)';
      zone.orbs.push(orb);
    }

    function updateZoneOrbs(zone, dt, now) {
      if (!zone.bounds) return;
      for (let i = zone.orbs.length - 1; i >= 0; i--) {
        const orb = zone.orbs[i];

        if (now - orb.spawnTime > ORB_LIFETIME) {
          expireOrb(zone, i);
          continue;
        }

        orb.x += orb.vx * dt;
        orb.y += orb.vy * dt;

        if (orb.x < zone.bounds.left)        { orb.x = zone.bounds.left;   orb.vx = Math.abs(orb.vx); }
        else if (orb.x > zone.bounds.right)  { orb.x = zone.bounds.right;  orb.vx = -Math.abs(orb.vx); }
        if (orb.y < zone.bounds.top)         { orb.y = zone.bounds.top;    orb.vy = Math.abs(orb.vy); }
        else if (orb.y > zone.bounds.bottom) { orb.y = zone.bounds.bottom; orb.vy = -Math.abs(orb.vy); }

        orb.wrapperEl.style.transform = 'translate(' + (orb.x - orb.radius) + 'px, ' + (orb.y - orb.radius) + 'px)';
      }
    }

    function expireOrb(zone, index) {
      const orb = zone.orbs[index];
      zone.orbs.splice(index, 1);
      orb.innerEl.classList.add('orb-expire');
      window.setTimeout(function () {
        orb.wrapperEl.remove();
      }, 220);
    }

    function collectOrb(zone, orb, index) {
      zone.orbs.splice(index, 1);
      orb.wrapperEl.remove();

      const value = SCORE_VALUES[orb.type];
      zone.score = Math.max(0, zone.score + value); // score never dips below 0
      zone.scoreEl.textContent = String(zone.score);
      bumpScore(zone.scoreEl);

      const label = (value > 0 ? '+' : '') + value;
      spawnFloatText(zone, orb.x, orb.y, label, orb.type);
      spawnBurst(zone, orb.x, orb.y, orb.type);

      if (orb.type === 'trap') {
        flashZone(zone);
        playTrapSound();
      } else if (orb.type === 'relic') {
        playRelicSound();
      } else {
        playNormalSound();
      }
    }

    function clearAllOrbs(zone) {
      zone.orbs.forEach(function (orb) { orb.wrapperEl.remove(); });
      zone.orbs.length = 0;
    }

    // ---------------------------------------------------------------
    // SCORE / VISUAL FEEDBACK
    // ---------------------------------------------------------------
    function bumpScore(el) {
      el.classList.remove('pop');
      void el.offsetWidth; // force reflow so the animation replays
      el.classList.add('pop');
    }

    function spawnFloatText(zone, x, y, label, type) {
      const el = document.createElement('span');
      el.className = 'float-text float-' + type;
      el.textContent = label;
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      zone.floatLayer.appendChild(el);
      el.addEventListener('animationend', function () { el.remove(); }, { once: true });
    }

    function spawnBurst(zone, x, y, type) {
      const el = document.createElement('span');
      el.className = 'orb-burst burst-' + type;
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      zone.floatLayer.appendChild(el);
      el.addEventListener('animationend', function () { el.remove(); }, { once: true });
    }

    function flashZone(zone) {
      zone.flashEl.classList.remove('active');
      void zone.flashEl.offsetWidth; // force reflow so the animation replays
      zone.flashEl.classList.add('active');
    }

    // ---------------------------------------------------------------
    // INPUT: tap or slice, multi-touch safe, rotation-aware
    // Hit-testing happens at the zone level (not per-orb) so ephemeral
    // orbs never need their own listeners added/removed.
    // ---------------------------------------------------------------
    function bindZoneInput(zone) {
      const lastPos = new Map(); // pointerId -> last known {x, y} in client coords

      function testAndCollect(clientX, clientY, prevClient) {
        if (!gameActive) return;
        const cur = clientToLocal(zone, clientX, clientY);
        const prev = prevClient ? clientToLocal(zone, prevClient.x, prevClient.y) : cur;

        for (let i = zone.orbs.length - 1; i >= 0; i--) {
          const orb = zone.orbs[i];
          const dist = distanceToSegment(orb.x, orb.y, prev.x, prev.y, cur.x, cur.y);
          if (dist <= orb.radius + TAP_TOLERANCE) {
            collectOrb(zone, orb, i);
          }
        }
      }

      zone.el.addEventListener('pointerdown', function (e) {
        lastPos.set(e.pointerId, { x: e.clientX, y: e.clientY });
        testAndCollect(e.clientX, e.clientY, null);
      });

      zone.el.addEventListener('pointermove', function (e) {
        const prev = lastPos.get(e.pointerId);
        if (!prev) return; // only track pointers that started on this zone
        testAndCollect(e.clientX, e.clientY, prev);
        lastPos.set(e.pointerId, { x: e.clientX, y: e.clientY });
      });

      function release(e) { lastPos.delete(e.pointerId); }
      zone.el.addEventListener('pointerup', release);
      zone.el.addEventListener('pointercancel', release);
      zone.el.addEventListener('pointerleave', release);
    }

    function bindTap(el, handler) {
      el.addEventListener('pointerdown', handler);
      el.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
          e.preventDefault();
          handler();
        }
      });
    }

    // ---------------------------------------------------------------
    // SPAWN SCHEDULING
    // ---------------------------------------------------------------
    function scheduleNextSpawn(zone) {
      if (!gameActive) return;
      zone.spawnTimeoutId = window.setTimeout(function () {
        spawnOrb(zone);
        scheduleNextSpawn(zone);
      }, currentSpawnInterval());
    }

    function stopSpawning(zone) {
      if (zone.spawnTimeoutId !== null) {
        window.clearTimeout(zone.spawnTimeoutId);
        zone.spawnTimeoutId = null;
      }
    }

    // ---------------------------------------------------------------
    // GAME LOOP
    // ---------------------------------------------------------------
    function gameLoop(timestamp) {
      if (!gameActive) return;
      if (lastFrameTime === null) lastFrameTime = timestamp;
      const dt = Math.min((timestamp - lastFrameTime) / 1000, 0.05);
      lastFrameTime = timestamp;

      updateZoneOrbs(zones.p1, dt, timestamp);
      updateZoneOrbs(zones.p2, dt, timestamp);

      rafId = requestAnimationFrame(gameLoop);
    }

    function startGameLoop() {
      lastFrameTime = null;
      rafId = requestAnimationFrame(gameLoop);
    }

    function stopGameLoop() {
      if (rafId !== null) {
        cancelAnimationFrame(rafId);
        rafId = null;
      }
    }

    // ---------------------------------------------------------------
    // TIMER
    // ---------------------------------------------------------------
    function tickTimer() {
      timeLeft -= 1;
      timerValueEl.textContent = String(timeLeft);
      centerTimerEl.classList.toggle('time-warning', timeLeft > 0 && timeLeft <= 10);

      if (timeLeft <= 0) {
        endGame();
      }
    }

    function startTimer() {
      timerValueEl.textContent = String(timeLeft);
      timerId = window.setInterval(tickTimer, 1000);
    }

    function stopTimer() {
      if (timerId !== null) {
        window.clearInterval(timerId);
        timerId = null;
      }
    }

    // ---------------------------------------------------------------
    // GAME OVER
    // ---------------------------------------------------------------
    function endGame() {
      gameActive = false;
      stopTimer();
      stopGameLoop();
      stopSpawning(zones.p1);
      stopSpawning(zones.p2);
      clearAllOrbs(zones.p1);
      clearAllOrbs(zones.p2);

      zones.p1.el.disabled = true;
      zones.p2.el.disabled = true;

      let title, winnerClass;
      if (zones.p1.score > zones.p2.score) {
        title = 'Human Realm Wins!';
        winnerClass = 'winner-p1';
      } else if (zones.p2.score > zones.p1.score) {
        title = 'Demon Realm Wins!';
        winnerClass = 'winner-p2';
      } else {
        title = "It's a Tie!";
        winnerClass = 'winner-tie';
      }

      resultTitleEl.textContent = title;
      resultTitleEl.classList.remove('winner-p1', 'winner-p2', 'winner-tie');
      resultTitleEl.classList.add(winnerClass);
      resultScoresEl.textContent = 'Human: ' + zones.p1.score + ' - Demon: ' + zones.p2.score;

      gameOverOverlay.classList.add('is-visible');
      gameOverOverlay.setAttribute('aria-hidden', 'false');
      playAgainBtn.focus();

      // ---- AD TRIGGER POINT: round end ----
      // showInterstitialAd(); // enable once implemented above
      // --------------------------------------
    }

    // ---------------------------------------------------------------
    // RESTART
    // ---------------------------------------------------------------
    function resetGame() {
      clearAllOrbs(zones.p1);
      clearAllOrbs(zones.p2);

      zones.p1.score = 0;
      zones.p2.score = 0;
      zones.p1.scoreEl.textContent = '0';
      zones.p2.scoreEl.textContent = '0';

      timeLeft = GAME_DURATION;
      gameActive = true;

      zones.p1.el.disabled = false;
      zones.p2.el.disabled = false;
      centerTimerEl.classList.remove('time-warning');

      gameOverOverlay.classList.remove('is-visible');
      gameOverOverlay.setAttribute('aria-hidden', 'true');

      recomputeZoneBounds(zones.p1);
      recomputeZoneBounds(zones.p2);

      startTimer();
      scheduleNextSpawn(zones.p1);
      scheduleNextSpawn(zones.p2);
      startGameLoop();
    }

    // ---------------------------------------------------------------
    // START SCREEN
    // Shown only until the player picks a round length and taps
    // Start Game. From then on, Play Again reuses whatever
    // GAME_DURATION was picked here and skips this screen entirely.
    // ---------------------------------------------------------------
    let selectedDuration = GAME_DURATION;

    function bindStartScreen() {
      const optionButtons = startScreen.querySelectorAll('.duration-option');

      optionButtons.forEach(function (btn) {
        bindTap(btn, function () {
          selectedDuration = parseInt(btn.dataset.duration, 10);
          optionButtons.forEach(function (b) { b.classList.remove('is-selected'); });
          btn.classList.add('is-selected');
        });
      });

      bindTap(startBtn, function () {
        GAME_DURATION = selectedDuration;
        startScreen.classList.remove('is-visible');
        startScreen.setAttribute('aria-hidden', 'true');
        instructionsScreen.classList.add('is-visible');
        instructionsScreen.setAttribute('aria-hidden', 'false');
        playNowBtn.focus();
      });

      bindTap(playNowBtn, function () {
        instructionsScreen.classList.remove('is-visible');
        instructionsScreen.setAttribute('aria-hidden', 'true');
        startMusic();
        resetGame(); // sets timeLeft = GAME_DURATION, enables zones, starts timer/spawning/loop
      });
    }

    // Called from the Game Over card's "Main Menu" button. Fully
    // stops the current round (unlike resetGame, zones stay
    // disabled) and brings back the Start Screen so a new round
    // length can be chosen. The duration pills keep whatever was
    // last selected, so re-picking the same one is a single tap.
    function returnToMenu() {
      gameActive = false;
      stopTimer();
      stopGameLoop();
      stopSpawning(zones.p1);
      stopSpawning(zones.p2);
      clearAllOrbs(zones.p1);
      clearAllOrbs(zones.p2);

      zones.p1.score = 0;
      zones.p2.score = 0;
      zones.p1.scoreEl.textContent = '0';
      zones.p2.scoreEl.textContent = '0';

      zones.p1.el.disabled = true;
      zones.p2.el.disabled = true;
      centerTimerEl.classList.remove('time-warning');

      gameOverOverlay.classList.remove('is-visible');
      gameOverOverlay.setAttribute('aria-hidden', 'true');

      stopMusic();
      startScreen.classList.add('is-visible');
      startScreen.setAttribute('aria-hidden', 'false');
      startBtn.focus();
    }

    // ---------------------------------------------------------------
    // INIT
    // ---------------------------------------------------------------
    function init() {
      recomputeZoneBounds(zones.p1);
      recomputeZoneBounds(zones.p2);

      bindZoneInput(zones.p1);
      bindZoneInput(zones.p2);
      bindTap(playAgainBtn, resetGame);
      bindTap(mainMenuBtn, returnToMenu);
      bindAudioToggles();
      bindStartScreen();

      window.addEventListener('resize', function () {
        recomputeZoneBounds(zones.p1);
        recomputeZoneBounds(zones.p2);
      });

      // Gameplay (timer/spawning/loop) only begins once Start Game is
      // pressed -- see bindStartScreen() above -- not on page load.
    }

    init();
  })();
  </script>
